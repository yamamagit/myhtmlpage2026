const columns=data.headers.slice(1).map((h,i)=>{const [school,year,...rest]=h.split('_');return {school,year,exam:rest.join('_'),index:i+1,header:h};});
const schools=[...new Set(columns.map(c=>c.school))],years=[...new Set(columns.map(c=>c.year))].sort((a,b)=>b-a);
function chips(id,values){for(const value of values){const label=document.createElement('label');label.className='chip';const box=document.createElement('input');box.type='checkbox';box.value=value;box.checked=true;box.addEventListener('change',render);label.append(box,document.createTextNode(value));$(id).append(label);}}
chips('schools',schools);chips('years',years);
for(const g of [...new Set(data.groups)])$('group').add(new Option(g,g));
for(const e of [...new Set(columns.map(c=>c.exam))])$('exam').add(new Option(e,e));
function selected(id){return [...$(id).querySelectorAll('input:checked')].map(e=>e.value);}
function choose(id,predicate){for(const e of $(id).querySelectorAll('input'))e.checked=predicate(e.value);}
let visibleColumns=[],visibleRows=[];
function render(){
 const ss=selected('schools'),yy=selected('years');
 visibleColumns=columns.filter(c=>ss.includes(c.school)&&yy.includes(c.year)&&(!$('exam').value||c.exam===$('exam').value));
 const query=$('search').value.trim().toLocaleLowerCase();
 visibleRows=data.rows.map((r,i)=>({name:r[0],group:data.groups[i],row:r,index:i,count:visibleColumns.filter(c=>r[c.index]).length,stars:visibleColumns.filter(c=>r[c.index]==='★').length})).filter(r=>(!query||(r.name+' '+r.group).toLocaleLowerCase().includes(query))&&(!$('group').value||r.group===$('group').value)&&(!$('only').checked||r.count>0));
 if($('sort').value==='frequency')visibleRows.sort((a,b)=>b.count-a.count||a.index-b.index);
 if($('sort').value==='stars')visibleRows.sort((a,b)=>b.stars-a.stars||a.index-b.index);
 $('schoolCount').textContent=new Set(visibleColumns.map(c=>c.school)).size;$('examCount').textContent=visibleColumns.length;$('fieldCount').textContent=visibleRows.length;
 $('table').classList.toggle('compact',$('compact').checked);
 const head=$('table').tHead,body=$('table').tBodies[0];head.replaceChildren();body.replaceChildren();
 const tr=document.createElement('tr');const f=document.createElement('th');f.className='field';f.scope='col';f.textContent='分野';tr.append(f);
 const rate=document.createElement('th');rate.className='rate';rate.scope='col';rate.textContent='出題率';tr.append(rate);
 for(const c of visibleColumns){const th=document.createElement('th');th.scope='col';const school=document.createElement('span');school.className='school';school.textContent=c.school;const year=document.createElement('small');year.textContent=c.year+'年度';const exam=document.createElement('small');exam.textContent=c.exam;th.append(school,year,exam);tr.append(th);}head.append(tr);
 let lastGroup='';
 for(const r of visibleRows){const row=document.createElement('tr');if(lastGroup!==r.group&&$('sort').value==='original')row.className='divider';lastGroup=r.group;const title=document.createElement('th');title.className='field';title.scope='row';const group=document.createElement('small');group.textContent=r.group;title.append(group,document.createTextNode(r.name));row.append(title);const percent=document.createElement('td');percent.className='rate';percent.textContent=visibleColumns.length?Math.round(r.count/visibleColumns.length*100)+'%':'—';percent.title=r.count+' / '+visibleColumns.length+' 試験';row.append(percent);
 const mobileRate=document.createElement('span');mobileRate.className='mobile-rate';mobileRate.textContent='出題率 '+percent.textContent;title.append(mobileRate);
 for(const c of visibleColumns){const mark=r.row[c.index];const cell=document.createElement('td');cell.className='mark'+(mark==='★'?' star':mark==='○'?' circle':'');cell.textContent=mark;cell.title=`${c.school} ${c.year}年度 ${c.exam} / ${r.name}：${mark||'原表に記号なし'}`;cell.addEventListener('click',()=>{$('status').textContent=cell.title;});row.append(cell);}body.append(row);}
 const empty=!visibleColumns.length||!visibleRows.length;$('empty').hidden=!empty;$('table').hidden=empty;$('empty').textContent=!visibleColumns.length?'該当する試験がありません。学校・年度・試験回の条件を変更してください。':'該当する分野がありません。検索・分野の条件を変更してください。';$('download').disabled=empty;$('status').textContent='';
}
for(const id of ['search','group','exam','sort','only','compact'])$(id).addEventListener(id==='search'?'input':'change',render);
$('allSchools').onclick=()=>{choose('schools',()=>true);render();};$('noSchools').onclick=()=>{choose('schools',()=>false);render();};$('allYears').onclick=()=>{choose('years',()=>true);render();};$('latest').textContent=years[0]+'年度のみ';$('latest').onclick=()=>{choose('years',v=>v===years[0]);render();};
$('reset').onclick=()=>{choose('schools',()=>true);choose('years',()=>true);for(const id of ['search','group','exam'])$(id).value='';$('sort').value='original';$('only').checked=false;$('compact').checked=false;render();};
$('download').onclick=()=>{const rows=[['分野',...visibleColumns.map(c=>c.header)],...visibleRows.map(r=>[r.name,...visibleColumns.map(c=>r.row[c.index])])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\r\n')+'\r\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='理科_出題分野表_絞り込み.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();
</script></body></html>
